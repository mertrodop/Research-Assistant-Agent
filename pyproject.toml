[project]
name = "ra-agent"
version = "0.1.0"
description = "Research Assistant Agent - OCR pipeline"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "PyMuPDF>=1.24",
    "PyYAML>=6.0",
    "rapidfuzz>=3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
vlm = ["docling>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ra-ocr = "ra_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
