[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducer"
version = "0.0.1"
description = "Reproduce reported paper results from a GitHub repo."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2,<2",
    "mcp>=2.3,<3",
    "pydantic>=2",
    "pyyaml>=6",
    "tomli>=2; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["reproducer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access (deselected by default)",
    "llm_live: calls a real LLM backend, e.g. local Ollama (deselected by default)",
    "docker: needs a local Docker daemon; builds/runs containers (deselected by default)",
]
addopts = "-m 'not network and not llm_live and not docker'"
