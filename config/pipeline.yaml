render:
  dpi: 144        # Granite-Docling preset scale 2.0
  high_dpi: 216
  max_dpi: 288
  ink_threshold: 200

router:
  native_text_min_chars: 200
  ink_ratio_vlm: 0.02

engine:
  name: granite_docling
  model_id: ibm-granite/granite-docling-258M
  device: auto
  page_batch_size: 1

gate:
  min_chars: 40
  min_printable_ratio: 0.95
  max_ngram_repeat: 6
  ngram_size: 8
  min_coverage: 0.35
  max_coverage: 3.0
  numeric_tolerance: 0.0

pipeline:
  concurrency: 2
  max_attempts: 3
  cache_dir: .cache/ocr

paths:
  raw_dir: data/raw
  vault_dir: vault
  staging_dir: staging
  memory_dir: memory

figures:
  enabled: true
  min_side: 100
  min_area_ratio: 0.01
  max_caption_gap: 140
  page_render_fallback: true
  render_dpi: 150
  describe: true

models:
  agent:
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3-vl-8b-instruct
    api_key_env: OPEN_ROUTER_API_KEY
  vision:
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3-vl-8b-instruct
    api_key_env: OPEN_ROUTER_API_KEY
    max_tokens: 2000   # reasoning models spend part of it before answering

vision_extra:
  concurrency: 2
  cache_dir: .cache/figures
  max_image_side: 1400

critic:
  enabled: false
  min_dimension: 3
  min_average: 3.5
  dpi: 110

crossref:
  enabled: false
  cache_dir: .cache/crossref
  timeout_s: 20
  mailto: ""
  min_score: 0.82
  year_tolerance: 1

references:
  max_attempts: 4
  use_llm: false
  mismatch_floor: 0.5

meta:              # document evaluator-optimizer, runs with crossref
  max_iter: 3
  min_title_score: 0.9
  min_author_overlap: 0.6
  max_unresolved_refs: 0.3

agent:
  max_steps: 12
  max_consecutive_errors: 2
  max_invalid_calls: 2
  context_budget: 6000
  keep_last_turns: 4
