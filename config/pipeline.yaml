render:
  dpi: 200
  high_dpi: 300
  max_dpi: 400
  ink_threshold: 200

router:
  native_text_min_chars: 200
  ink_ratio_vlm: 0.02

engine:
  name: granite_docling
  model_id: ibm-granite/granite-docling-258M
  device: auto
  page_batch_size: 1

gate:
  min_chars: 40
  min_printable_ratio: 0.95
  max_ngram_repeat: 6
  ngram_size: 8
  min_coverage: 0.35
  max_coverage: 3.0
  numeric_tolerance: 0.0

pipeline:
  concurrency: 2
  max_attempts: 3
  cache_dir: .cache/ocr
  vault_dir: vault

data:
  raw_dir: data/raw
  processed_dir: data/processed

figures:
  enabled: true
  min_side: 100
  min_area_ratio: 0.01
  max_caption_gap: 140
  page_render_fallback: true
  render_dpi: 150

vision:
  enabled: false
  model: google/gemini-2.5-flash
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPEN_ROUTER_API_KEY
  timeout_s: 90
  max_tokens: 700
  temperature: 0.0
  concurrency: 2
  cache_dir: .cache/figures
  max_image_side: 1400

critic:
  enabled: false
  min_dimension: 3
  min_average: 3.5

crossref:
  enabled: false
  cache_dir: .cache/crossref
  timeout_s: 20
  mailto: ""
  min_score: 0.82
  year_tolerance: 1
